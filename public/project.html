<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT-Ideenforum – Tickets</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="masthead">
    <div class="inner">
      <div class="topbar">
        <p class="eyebrow">Ideensammlung als Ticketsystem</p>
        <span class="topbar-links">
          <a class="gear-link back" href="settings.html">⚙ Einstellungen</a>
          <a class="back" href="index.html">&larr; Alle Projekte</a>
        </span>
      </div>
      <h1 id="project-title">Projekt</h1>
      <p class="sub" id="project-sub"></p>
    </div>
  </div>

  <div class="stats"><div class="inner" id="stats"></div></div>

  <div class="filterbar">
    <div class="inner">
      <div class="filterrow">
        <span class="fr-label">Kategorie</span>
        <button class="chip active" data-dim="cat" data-val="all">Alle</button>
        <button class="chip" data-dim="cat" data-val="Frontend">Frontend</button>
        <button class="chip" data-dim="cat" data-val="Backend">Backend</button>
        <button class="chip" data-dim="cat" data-val="Infrastruktur">Infrastruktur</button>
        <button class="chip" data-dim="cat" data-val="Prozess">Prozess</button>
        <span class="ai-picker">
          <label for="model-select">KI-Modell</label>
          <select id="model-select" class="model-select"></select>
          <button class="btn-primary" id="new-ticket-btn">+ Neues Ticket</button>
        </span>
      </div>
      <div class="filterrow">
        <span class="fr-label">Schweregrad</span>
        <button class="chip active" data-dim="sev" data-val="all">Alle</button>
        <button class="chip" data-dim="sev" data-val="Kritisch">Kritisch</button>
        <button class="chip" data-dim="sev" data-val="Hoch">Hoch</button>
        <button class="chip" data-dim="sev" data-val="Mittel">Mittel</button>
        <button class="chip" data-dim="sev" data-val="Klein">Klein</button>
        <button class="chip" data-dim="sev" data-val="Recherche">Recherche</button>
      </div>
      <div class="filterrow">
        <span class="fr-label">Status</span>
        <button class="chip active" data-dim="st" data-val="all">Alle</button>
        <button class="chip" data-dim="st" data-val="Offen">Offen</button>
        <button class="chip" data-dim="st" data-val="In Arbeit">In Arbeit</button>
        <button class="chip" data-dim="st" data-val="Erledigt">Erledigt</button>
        <button class="chip" data-dim="st" data-val="Zurückgestellt">Zurückgestellt</button>
        <span class="filter-counter" id="counter"></span>
      </div>
    </div>
  </div>

  <section class="overview">
    <h2>Übersicht</h2>
    <p class="hint">Klick auf eine Zeile springt zur Detailkarte weiter unten. Filter oben schränken Übersicht UND Detailkarten gemeinsam ein.</p>
    <div class="ovw-scroll">
      <table class="ovw">
        <thead><tr><th>Nr.</th><th>Titel</th><th>Kategorie</th><th>Schweregrad</th><th>Status</th></tr></thead>
        <tbody id="ovw-body"></tbody>
      </table>
    </div>
  </section>

  <div class="detail-wrap" id="detail-wrap"></div>

  <footer class="pagefoot" id="pagefoot"></footer>

  <div id="ticket-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="ticket-modal-title">Neues Ticket</h2>
      <form id="ticket-form">
        <input type="hidden" id="ticket-id" />
        <div class="form-group">
          <label for="ticket-titel">Titel</label>
          <input type="text" id="ticket-titel" required />
        </div>
        <div class="form-group">
          <label for="ticket-beschreibung">Beschreibung</label>
          <textarea id="ticket-beschreibung" rows="4"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="ticket-kategorie">Kategorie</label>
            <select id="ticket-kategorie">
              <option value="Frontend">Frontend</option>
              <option value="Backend">Backend</option>
              <option value="Infrastruktur">Infrastruktur</option>
              <option value="Prozess">Prozess</option>
            </select>
          </div>
          <div class="form-group">
            <label for="ticket-schweregrad">Schweregrad</label>
            <select id="ticket-schweregrad">
              <option value="Kritisch">Kritisch</option>
              <option value="Hoch">Hoch</option>
              <option value="Mittel">Mittel</option>
              <option value="Klein">Klein</option>
              <option value="Recherche">Recherche</option>
            </select>
          </div>
          <div class="form-group">
            <label for="ticket-status">Status</label>
            <select id="ticket-status">
              <option value="Offen">Offen</option>
              <option value="In Arbeit">In Arbeit</option>
              <option value="Erledigt">Erledigt</option>
              <option value="Zurückgestellt">Zurückgestellt</option>
            </select>
          </div>
        </div>
        <div class="error-text" id="ticket-form-error"></div>
        <div class="modal-actions">
          <button type="button" id="ticket-cancel-btn">Abbrechen</button>
          <button type="submit" class="btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/version.js"></script>
  <script src="js/project.js"></script>
</body>
</html>
