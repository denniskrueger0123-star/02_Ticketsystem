<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT-Ideenforum – Projekte</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>IT-Ideenforum</h1>
  </header>

  <main>
    <div class="toolbar">
      <div></div>
      <button id="new-project-btn" class="btn-primary">+ Neues Projekt</button>
    </div>

    <div id="project-list" class="card-list"></div>
  </main>

  <div id="project-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title">Neues Projekt</h2>
      <form id="project-form">
        <input type="hidden" id="project-id" />
        <div class="form-group">
          <label for="project-name">Name</label>
          <input type="text" id="project-name" required />
        </div>
        <div class="form-group">
          <label for="project-description">Beschreibung</label>
          <textarea id="project-description" rows="3"></textarea>
        </div>
        <div class="error-text" id="project-form-error"></div>
        <div class="modal-actions">
          <button type="button" id="project-cancel-btn">Abbrechen</button>
          <button type="submit" class="btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
