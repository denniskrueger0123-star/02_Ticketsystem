<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT-Ideenforum – Projekte</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="masthead">
    <div class="inner">
      <div class="topbar">
        <p class="eyebrow">Projekt-Dashboard</p>
        <a class="gear-link back" href="settings.html">⚙ Einstellungen</a>
      </div>
      <h1>IT-Ideenforum</h1>
      <p class="sub">Eigene IT-Vorhaben zentral verwalten – pro Projekt ein eigenes Ticketsystem.</p>
    </div>
  </div>

  <div class="toolbar">
    <button id="import-project-btn">⭱ Projekt importieren</button>
    <button class="btn-primary" id="new-project-btn">+ Neues Projekt</button>
    <input type="file" id="import-file-input" accept=".json,application/json" hidden />
  </div>

  <div id="project-list" class="project-list"></div>

  <footer class="pagefoot">IT-Ideenforum · lokal &amp; offline <span id="app-version"></span></footer>

  <div id="project-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2 id="modal-title">Neues Projekt</h2>
      <form id="project-form">
        <input type="hidden" id="project-id" />
        <div class="form-group">
          <label for="project-name">Name</label>
          <input type="text" id="project-name" required />
        </div>
        <div class="form-group">
          <label for="project-description">Beschreibung</label>
          <textarea id="project-description" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="project-skill">Zusätzliche KI-Anweisungen (optional)</label>
          <textarea id="project-skill" rows="3" placeholder="z. B. „Verwende TypeScript. Achte auf Barrierefreiheit. Schreibe Tests mit Vitest.“"></textarea>
          <p class="field-hint">Wird bei jeder Prompt-Generierung in diesem Projekt automatisch mitgeschickt.</p>
        </div>
        <div class="error-text" id="project-form-error"></div>
        <div class="modal-actions">
          <button type="button" id="project-cancel-btn">Abbrechen</button>
          <button type="submit" class="btn-primary">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/version.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
